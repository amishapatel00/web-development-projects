<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Countdown Timer With Progress</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div class="container">
      <!-- timer heading -->
      <h1>Countdown Timer With Progress</h1>

      <!-- day/hr/min/sec--block  -->
      <div id="countdown">
        <div><span id="days">00</span></div>
        <div><span id="hours">00</span></div>
        <div><span id="min">00</span></div>
        <div><span id="sec">00</span></div>
      </div>
      <!-- progress heading -->
      <h2>progress</h2>
      <!-- progress bar  -->
      <div class="progress-container">
        <div id="progress-bar"></div>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
</html>
